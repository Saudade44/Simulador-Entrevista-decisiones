<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De la oralidad al papel: editar a Jorge Ávila · Simulador de Decisión</title>
<style>
  :root {
    --bg: #FBF9F5;
    --card: #FFFFFF;
    --ink: #2A2421;
    --muted: #655B54;
    --terracotta: #B85233;
    --terracotta-dark: #963E23;
    --terracotta-light: #F7EBE7;
    --forest: #4F6838;
    --forest-dark: #3B4F29;
    --forest-light: #ECF2E6;
    --border: #E2DBD0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 14px 48px;
    background-color: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  .container { max-width: 760px; margin: 0 auto; }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .header-title { font-weight: 800; font-size: 17px; color: var(--ink); }
  .header-role { font-size: 14px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(42, 36, 33, 0.06);
  }
  .visual-box {
    width: 100%;
    background: #F3EFE6;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .visual-box svg { width: 100%; height: auto; display: block; }
  .visual-box img { max-width: 100%; max-height: 380px; object-fit: contain; display: block; }
  .content { padding: 26px 24px 30px; }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }
  .badge-decision { background: var(--terracotta-light); color: var(--terracotta); }
  .badge-final { background: var(--forest-light); color: var(--forest); }
  h1, h2, h3 { margin: 0 0 12px; line-height: 1.25; }
  .situation-text { font-size: 20px; margin: 0 0 24px; color: var(--ink); }
  .options-list { display: flex; flex-direction: column; gap: 14px; }
  .option-btn {
    width: 100%;
    text-align: left;
    background: var(--terracotta);
    color: #FFFFFF;
    border: none;
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.45;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: background 0.15s, transform 0.1s;
  }
  .option-btn:hover { background: var(--terracotta-dark); }
  .option-btn:active { transform: scale(0.99); }
  .opt-letter {
    background: rgba(255,255,255,0.22);
    padding: 2px 11px;
    border-radius: 8px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .login-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin: 18px 0 24px;
  }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 17px;
    border: 1px solid #C9BFB5;
    border-radius: 12px;
    margin-bottom: 14px;
    background: #FFFFFF;
  }
  .submit-sheet-box {
    background: var(--forest);
    color: #FFFFFF;
    border-radius: 18px;
    padding: 22px;
    margin: 22px 0;
  }
  .submit-sheet-btn {
    width: 100%;
    background: #FFFFFF;
    color: var(--forest-dark);
    border: none;
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 12px;
  }
  .submit-sheet-btn:disabled { opacity: 0.75; cursor: default; }
  .closing-box {
    background: var(--forest-light);
    border: 1px solid #C3D4B4;
    border-radius: 16px;
    padding: 18px 20px;
    margin: 20px 0;
  }
  .vars-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin: 16px 0 24px;
  }
  .var-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .bar-bg {
    width: 100%;
    height: 10px;
    background: #DFD9CE;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 8px;
  }
  .bar-fill { height: 100%; background: var(--forest); border-radius: 99px; }
  .step-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 16px;
  }
  .code-box {
    background: #2A2421;
    color: #FFFFFF;
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
  }
  .secondary-btn {
    background: #3E3632;
    color: #FFFFFF;
    border: 1px solid #594E49;
    padding: 9px 15px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .msg-banner {
    display: none;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 700;
    background: var(--terracotta-light);
    color: var(--terracotta-dark);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <div>
      <div class="header-title" id="sim-title"></div>
      <div class="header-role" id="sim-role"></div>
    </div>
    <button class="secondary-btn" onclick="restartSim()">Reiniciar</button>
  </div>
  <div class="card" id="sim-screen"></div>
</div>

      "text": "TRANSCRIPCIÓN CRUDA (Tramo 2):\n—En el final de la dictadura cívico-militar ocurría la guerra de malvinas.\n—En realidad, cuando pasó eso, yo estaba en Córdoba, trabajando en la recolección de residuos. Nos anotábamos como voluntarios para ir a la guerra. Yo no me alcancé a anotar, porque a Córdoba no llegó no sé qué pasó ni qué cosa, pero varios compañeros del país que habían caído presos, se anotaron de voluntarios para ir.\n\n¿Qué hacés con la intervención del estudiante-entrevistador?",

      "title": "El Equilibrio del Editor",
      "text": "Resultado: Edición periodística equilibrada. Lograste transformar el audio crudo en una pieza gráfica legible sin traicionar la voz de Jorge Ávila. Limpiaste los errores de la máquina y ordenaste los bloques temáticos, pero conservaste sus marcas platenses (5 y 70), su léxico popular (\"me desocupó Menem\", \"hicieron mierda toda la casa\") y su posicionamiento político intactos.",

      "visualType": "svg",
      "visualContent": "\u003csvg viewBox=\"0 0 800 420\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\n  \u003cdefs\u003e\n    \u003c!-- Estilos generales y fuentes --\u003e\n    \u003cstyle\u003e\n      @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');\n      .font-serif { font-family: 'Merriweather', Georgia, serif; }\n      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }\n      .shadow-panel { filter: drop-shadow(0 12px 24px rgba(44, 31, 20, 0.12)); }\n      .shadow-paper { filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.08)); }\n      .shadow-badge { filter: drop-shadow(0 2px 6px rgba(180, 83, 9, 0.2)); }\n    \u003c/style\u003e\n\n    \u003c!-- Gradientes de ambiente cálido editorial --\u003e\n    \u003clinearGradient id=\"bgGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#FDFBF7\"/\u003e\n      \u003cstop offset=\"50%\" stop-color=\"#F4EFE6\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#EBE3D5\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003c!-- Gradiente para la madera de la mesa de trabajo --\u003e\n    \u003clinearGradient id=\"deskGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#C8966E\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#A4724B\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003clinearGradient id=\"goldGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#D97706\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#B45309\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003c!-- Patrón de textura sutil para el fondo --\u003e\n    \u003cpattern id=\"dotPattern\" x=\"0\" y=\"0\" width=\"24\" height=\"24\" patternUnits=\"userSpaceOnUse\"\u003e\n      \u003ccircle cx=\"2\" cy=\"2\" r=\"1\" fill=\"#D4C5B9\" opacity=\"0.4\"/\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003c!-- Fondo General con textura --\u003e\n  \u003crect width=\"800\" height=\"420\" fill=\"url(#bgGrad)\" /\u003e\n  \u003crect width=\"800\" height=\"420\" fill=\"url(#dotPattern)\" /\u003e\n\n  \u003c!-- Superficie de escritorio en la parte inferior --\u003e\n  \u003cpath d=\"M 0 380 L 800 380 L 800 420 L 0 420 Z\" fill=\"url(#deskGrad)\" /\u003e\n  \u003cpath d=\"M 0 380 L 800 380\" stroke=\"#8D5D3B\" stroke-width=\"3\" /\u003e\n\n  \u003c!-- ========================================== --\u003e\n  \u003c!-- LADO IZQUIERDO: INTERFAZ DE NODO / RESULTADO --\u003e\n  \u003c!-- ========================================== --\u003e\n  \u003cg transform=\"translate(30, 25)\"\u003e\n    \u003c!-- Panel contenedor principal --\u003e\n    \u003crect width=\"330\" height=\"340\" rx=\"12\" fill=\"#FFFFFF\" class=\"shadow-panel\" stroke=\"#E5D9C5\" stroke-width=\"1.5\"/\u003e\n    \n    \u003c!-- Encabezado del Nodo --\u003e\n    \u003cpath d=\"M 0 12 A 12 12 0 0 1 12 0 L 318 0 A 12 12 0 0 1 330 12 L 330 55 L 0 55 Z\" fill=\"#2C241D\"/\u003e\n    \u003ctext x=\"20\" y=\"24\" class=\"font-sans\" font-size=\"10\" font-weight=\"600\" fill=\"#D97706\" letter-spacing=\"1\"\u003eNODO F1 • EL EQUILIBRIO DEL EDITOR\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"42\" class=\"font-sans\" font-size=\"13\" font-weight=\"700\" fill=\"#FFFFFF\"\u003eResultado: Edición equilibrada\u003c/text\u003e\n\n    \u003c!-- Contenido de texto explicativo --\u003e\n    \u003cg transform=\"translate(20, 75)\"\u003e\n      \u003c!-- Badge de Estado --\u003e\n      \u003crect x=\"0\" y=\"0\" width=\"145\" height=\"22\" rx=\"4\" fill=\"#FEF3C7\" class=\"shadow-badge\"/\u003e\n      \u003ctext x=\"10\" y=\"15\" class=\"font-sans\" font-size=\"10\" font-weight=\"700\" fill=\"#B45309\"\u003e✓ VOZ AUTÉNTICA PRESERVADA\u003c/text\u003e\n\n      \u003c!-- Párrafo descriptivo --\u003e\n      \u003ctext x=\"0\" y=\"45\" class=\"font-sans\" font-size=\"11\" font-weight=\"400\" fill=\"#4B3B32\" width=\"290\"\u003e\n        \u003ctspan x=\"0\" dy=\"0\"\u003eLograste transformar el audio crudo en una pieza\u003c/tspan\u003e\n        \u003ctspan x=\"0\" dy=\"16\"\u003egráfica legible sin traicionar la voz de \u003ctspan font-weight=\"600\"\u003eJorge Ávila\u003c/tspan\u003e.\u003c/tspan\u003e\n        \u003ctspan x=\"0\" dy=\"24\"\u003eLimpiaste titubeos y ordenaste bloques temáticos,\u003c/tspan\u003e\n        \u003ctspan x=\"0\" dy=\"16\"\u003econservando sus marcas platenses (\u003ctspan font-weight=\"600\" fill=\"#B45309\"\u003e5 y 70\u003c/tspan\u003e), su léxico\u003c/tspan\u003e\n        \u003ctspan x=\"0\" dy=\"16\"\u003epopular y su fuerte posicionamiento político.\u003c/tspan\u003e\n      \u003c/text\u003e\n\n      \u003c!-- Mini tarjeta de citas clave detectadas --\u003e\n      \u003cg transform=\"translate(0, 145)\"\u003e\n        \u003crect x=\"0\" y=\"0\" width=\"290\" height=\"55\" rx=\"6\" fill=\"#FBF8F3\" stroke=\"#E5D9C5\" stroke-width=\"1\"/\u003e\n        \u003cline x1=\"12\" y1=\"12\" x2=\"12\" y2=\"43\" stroke=\"#D97706\" stroke-width=\"3\" stroke-linecap=\"round\"/\u003e\n        \u003ctext x=\"24\" y=\"22\" class=\"font-serif\" font-size=\"10\" font-style=\"italic\" fill=\"#5C4A3E\"\u003e\"Me desocupó Menem...\"\u003c/text\u003e\n        \u003ctext x=\"24\" y=\"38\" class=\"font-serif\" font-size=\"10\" font-style=\"italic\" fill=\"#5C4A3E\"\u003e\"Hicieron mierda toda la casa\"\u003c/text\u003e\n      \u003c/g\u003e\n    \u003c/g\u003e\n  \u003c/g\u003e\n\n  \u003c!-- ========================================== --\u003e\n  \u003c!-- LADO DERECHO: PÁGINA DE REVISTA IMPRESA --\u003e\n  \u003c!-- ========================================== --\u003e\n  \u003cg transform=\"translate(390, 20)\"\u003e\n    \u003c!-- Sombra de la revista --\u003e\n    \u003crect x=\"15\" y=\"15\" width=\"360\" height=\"350\" rx=\"4\" fill=\"#1C1511\" opacity=\"0.15\" class=\"shadow-paper\"/\u003e\n    \n    \u003c!-- Base de la página de revista (Papel ahuesado) --\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"360\" height=\"350\" rx=\"4\" fill=\"#FFFFFF\" stroke=\"#D6CABA\" stroke-width=\"1\"/\u003e\n    \n    \u003c!-- Cabecera de la revista (Gacetilla / Institucional) --\u003e\n    \u003cline x1=\"30\" y1=\"25\" x2=\"330\" y2=\"25\" stroke=\"#2C241D\" stroke-width=\"2\"/\u003e\n    \u003ctext x=\"30\" y=\"20\" class=\"font-sans\" font-size=\"9\" font-weight=\"700\" fill=\"#78716C\" letter-spacing=\"1.5\"\u003eBELLAS ARTES UNLP • LENGUA Y PRODUCCIÓN\u003c/text\u003e\n    \u003ctext x=\"315\" y=\"20\" class=\"font-sans\" font-size=\"9\" font-weight=\"700\" fill=\"#78716C\"\u003eESP. 3°\u003c/text\u003e\n\n    \u003c!-- TÍTULO PRINCIPAL DE LA ENTREVISTA --\u003e\n    \u003cg transform=\"translate(30, 48)\"\u003e\n      \u003ctext x=\"0\" y=\"0\" class=\"font-serif\" font-size=\"22\" font-weight=\"700\" fill=\"#1C1511\"\u003e\n        \u003ctspan x=\"0\" dy=\"0\"\u003e\"La memoria resiste\u003c/tspan\u003e\n        \u003ctspan x=\"0\" dy=\"26\"\u003een la 5 y 70\"\u003c/tspan\u003e\n      \u003c/text\u003e\n      \u003c!-- Subtítulo periodístico --\u003e\n      \u003ctext x=\"0\" y=\"60\" class=\"font-sans\" font-size=\"11\" font-weight=\"500\" fill=\"#92400E\"\u003e\n        Entrevista a Jorge Ávila: Oralidad, archivo y resistencia política.\n      \u003c/text\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Línea divisoria decorativa --\u003e\n    \u003cline x1=\"30\" y1=\"125\" x2=\"330\" y2=\"125\" stroke=\"#E5E7EB\" stroke-width=\"1\"/\u003e\n\n    \u003c!-- DIAGRAMACIÓN EN DOS COLUMNAS DE LA REVISTA --\u003e\n    \u003c!-- Columna 1 --\u003e\n    \u003cg transform=\"translate(30, 140)\"\u003e\n      \u003c!-- Letra Capital --\u003e\n      \u003ctext x=\"0\" y=\"26\" class=\"font-serif\" font-size=\"34\" font-weight=\"700\" fill=\"#B45309\"\u003eE\u003c/text\u003e\n      \u003ctext x=\"24\" y=\"12\" class=\"font-serif\" font-size=\"9\" font-weight=\"400\" fill=\"#332922\"\u003el grabador registra el\u003c/text\u003e\n      \u003ctext x=\"24\" y=\"23\" class=\"font-serif\" font-size=\"9\" font-weight=\"400\" fill=\"#332922\"\u003eclima de época. Cuando\u003c/text\u003e\n      \n      \u003c!-- Líneas de texto simulado (bloques editoriales limpios) --\u003e\n      \u003crect x=\"0\" y=\"34\" width=\"130\" height=\"5\" rx=\"2\" fill=\"#E5E7EB\"/\u003e\n      \u003crect x=\"0\" y=\"44\" width=\"125\" height=\"5\" rx=\"2\" fill=\"#E5E7EB\"/\u003e\n      \u003crect x=\"0\" y=\"54\" width=\"130\" height=\"5\" rx=\"2\" fill=\"#E5E7EB\"/\u003e\n      \u003crect x=\"0\" y=\"64\" width=\"110\" height=\"5\" rx=\"2\" fill=\"#E5E7EB\"/\u003e\n      \n      \u003c!-- Cita destacada en la columna --\u003e\n      \u003crect x=\"0\" y=\"80\" width=\"135\" height=\"60\" rx=\"4\" fill=\"#FFFBEB\" stroke=\"#FDE68A\" stroke-width=\"1\"/\u003e\n      \u003ctext x=\"8\" y=\"98\" class=\"font-serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" fill=\"#92400E\"\u003e\"Me desocupó\u003c/text\u003e\n      \u003ctext x=\"8\" y=\"110\" class=\"font-serif\" font-size=\"9\" font-style=\"italic\" font-weight=\"700\" fill=\"#92400E\"\u003eMenem, hermano...\u003c/text\u003e\n      \u003ctext x=\"8\" y=\"127\" class=\"font-sans\" font-size=\"8\" font-weight=\"600\" fill=\"#78716C\"\u003e— JORGE ÁVILA\u003c/text\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Columna 2 --\u003e\n    \u003cg transform=\"translate(185, 140)\"\u003e\n      \u003c!-- Líneas de texto simulado --\u003e\n      \u003crect x=\"0\" y=\"2\" width=\"135\" height=\"5\" rx=\"2\" fill=\"#332922\" opacity=\"0.8\"/\u003e\n      \u003crect x=\"0\" y=\"12\" width=\"130\" height=\"5\" rx=\"2\" fill=\"#332922\" opacity=\"0.8\"/\u003e\n      \u003crect x=\"0\" y=\"22\" width=\"135\" height=\"5\" rx=\"2\" fill=\"#332922\" opacity=\"0.8\"/\u003e\n      \u003crect x=\"0\" y=\"32\" width=\"115\" height=\"5\" rx=\"2\" fill=\"#332922\" opacity=\"0.8\"/\u003e\n      \n      \u003crect x=\"0\" y=\"48\" width=\"130\" height=\"5\" rx=\"2\" fill=\"#E5E7EB\"/\u003e\n      \u003crect x=\"0\" y=\"58\" width=\"135\" height=\"5\" rx=\"2\" fill=\"#E5E7EB\"/\u003e\n      \u003crect x=\"0\" y=\"68\" width=\"120\" height=\"5\" rx=\"2\" fill=\"#E5E7EB\"/\u003e\n\n      \u003c!-- Segunda cita fuerte --\u003e\n      \u003cg transform=\"translate(0, 85)\"\u003e\n        \u003cline x1=\"0\" y1=\"0\" x2=\"0\" y2=\"40\" stroke=\"#B45309\" stroke-width=\"2\"/\u003e\n        \u003ctext x=\"10\" y=\"12\" class=\"font-serif\" font-size=\"8.5\" font-style=\"italic\" fill=\"#4B3B32\"\u003e\"Vinieron y nos hicieron\u003c/text\u003e\n        \u003ctext x=\"10\" y=\"24\" class=\"font-serif\" font-size=\"8.5\" font-style=\"italic\" fill=\"#4B3B32\"\u003emierda toda la casa,\u003c/text\u003e\n        \u003ctext x=\"10\" y=\"36\" class=\"font-serif\" font-size=\"8.5\" font-style=\"italic\" fill=\"#4B3B32\"\u003epero la dignidad no.\"\u003c/text\u003e\n      \u003c/g\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Pie de página de la revista --\u003e\n    \u003cline x1=\"30\" y1=\"320\" x2=\"330\" y2=\"320\" stroke=\"#E5D9C5\" stroke-width=\"1\"/\u003e\n    \u003ctext x=\"30\" y=\"335\" class=\"font-sans\" font-size=\"8\" font-weight=\"600\" fill=\"#A89F91\"\u003eEDICIÓN UNIVERSITARIA • PRÁCTICAS DEL LENGUAJE\u003c/text\u003e\n    \u003ctext x=\"320\" y=\"335\" class=\"font-sans\" font-size=\"8\" font-weight=\"700\" fill=\"#2C241D\"\u003e14\u003c/text\u003e\n  \u003c/g\u003e\n\n  \u003c!-- ========================================== --\u003e\n  \u003c!-- ELEMENTO DECORATIVO INFERIOR / CONTEXTO --\u003e\n  \u003c!-- ========================================== --\u003e\n  \u003cg transform=\"translate(30, 392)\"\u003e\n    \u003ccircle cx=\"10\" cy=\"8\" r=\"4\" fill=\"#10B981\"/\u003e\n    \u003ctext x=\"22\" y=\"12\" class=\"font-sans\" font-size=\"10\" font-weight=\"600\" fill=\"#FAF7F2\"\u003eBachillerato de Bellas Artes (UNLP) — Taller de Lengua y Producción de Textos\u003c/text\u003e\n  \u003c/g\u003e\n\u003c/svg\u003e",

      "type": "final",
      "title": "El Archivista Literal",
      "text": "Resultado: Conservación extrema de la oralidad. Preservaste cada vacilación, cada giro del diálogo real y el orden exacto en que fluyó la conversación. Sin embargo, el texto todavía funciona más como un documento de archivo para investigadores que como una entrevista lista para publicar en un periódico.",
      "closingComment": "Balance para llevar a tu propia entrevista: Cuidaste al máximo la fidelidad documental, pero el costo fue la legibilidad: los errores del transcriptor automático y los saltos temáticos obligan al lector a hacer un esfuerzo extra para seguir el hilo.",
      "visualType": "svg",
      "visualContent": "\u003csvg viewBox=\"0 0 800 420\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\n  \u003cdefs\u003e\n    \u003c!-- Gradientes de ambiente y materiales --\u003e\n    \u003clinearGradient id=\"bgGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#2C241D\"/\u003e\n      \u003cstop offset=\"50%\" stop-color=\"#1E1712\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#120E0A\"/\u003e\n    \u003c/linearGradient\u003e\n    \n    \u003clinearGradient id=\"woodDesk\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#5A3D28\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#3A2415\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003clinearGradient id=\"folderManila\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#E2B777\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#C29452\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003clinearGradient id=\"paperGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#FDFBF7\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#F2EFE9\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003clinearGradient id=\"cardGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#FFFDF9\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#EFECE6\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003c!-- Filtros de sombra --\u003e\n    \u003cfilter id=\"dropShadow\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"\u003e\n      \u003cfeDropShadow dx=\"2\" dy=\"4\" stdDeviation=\"4\" flood-color=\"#000\" flood-opacity=\"0.45\"/\u003e\n    \u003c/filter\u003e\n\n    \u003cfilter id=\"softShadow\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"\u003e\n      \u003cfeDropShadow dx=\"1\" dy=\"2\" stdDeviation=\"2\" flood-color=\"#000\" flood-opacity=\"0.2\"/\u003e\n    \u003c/filter\u003e\n  \u003c/defs\u003e\n\n  \u003c!-- Fondo de estudio / taller --\u003e\n  \u003crect width=\"800\" height=\"420\" fill=\"url(#bgGrad)\"/\u003e\n  \n  \u003c!-- Estantería de fondo difusa --\u003e\n  \u003cg opacity=\"0.35\"\u003e\n    \u003crect x=\"50\" y=\"40\" width=\"220\" height=\"120\" fill=\"#18120D\" rx=\"4\"/\u003e\n    \u003c!-- Libros en lomo --\u003e\n    \u003crect x=\"65\" y=\"55\" width=\"15\" height=\"95\" fill=\"#52392A\"/\u003e\n    \u003crect x=\"82\" y=\"65\" width=\"22\" height=\"85\" fill=\"#3B4F5E\"/\u003e\n    \u003crect x=\"106\" y=\"50\" width=\"12\" height=\"100\" fill=\"#6B3A31\"/\u003e\n    \u003crect x=\"120\" y=\"60\" width=\"30\" height=\"90\" fill=\"#425E48\"/\u003e\n    \u003crect x=\"152\" y=\"52\" width=\"18\" height=\"98\" fill=\"#755E38\"/\u003e\n    \u003crect x=\"172\" y=\"70\" width=\"25\" height=\"80\" fill=\"#4B315E\"/\u003e\n    \u003crect x=\"200\" y=\"58\" width=\"14\" height=\"92\" fill=\"#5C2E2E\"/\u003e\n    \u003crect x=\"216\" y=\"50\" width=\"35\" height=\"100\" fill=\"#333333\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Lámpara de escritorio (ángulo superior derecho) --\u003e\n  \u003cg opacity=\"0.85\"\u003e\n    \u003cpath d=\"M 680 0 L 710 80\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/\u003e\n    \u003cpath d=\"M 710 80 L 740 130\" stroke=\"#888\" stroke-width=\"4\" stroke-linecap=\"round\"/\u003e\n    \u003cpath d=\"M 720 120 L 755 155 C 765 165, 775 150, 765 140 L 735 110 Z\" fill=\"#D4AF37\" filter=\"url(#dropShadow)\"/\u003e\n    \u003c!-- Cono de luz ambiental sutil --\u003e\n    \u003cpolygon points=\"735,130 520,420 800,420\" fill=\"#FFEDB3\" opacity=\"0.04\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Escritorio de madera --\u003e\n  \u003crect x=\"0\" y=\"320\" width=\"800\" height=\"100\" fill=\"url(#woodDesk)\"/\u003e\n  \u003cline x1=\"0\" y1=\"320\" x2=\"800\" y2=\"320\" stroke=\"#25170E\" stroke-width=\"4\"/\u003e\n\n  \u003c!-- ELEMENTO PRINCIPAL: Carpeta de archivo documental abierta --\u003e\n  \u003cg transform=\"translate(360, 160)\" filter=\"url(#dropShadow)\"\u003e\n    \u003c!-- Base de la carpeta (solapas traseras) --\u003e\n    \u003cpath d=\"M -180 -100 L 180 -100 L 210 170 L -210 170 Z\" fill=\"#A87B3C\"/\u003e\n    \n    \u003c!-- Interior de la carpeta (Manila) --\u003e\n    \u003crect x=\"-195\" y=\"-115\" width=\"390\" height=\"280\" rx=\"8\" fill=\"url(#folderManila)\"/\u003e\n    \u003cline x1=\"0\" y1=\"-115\" x2=\"0\" y2=\"165\" stroke=\"#A77A38\" stroke-width=\"2\" stroke-dasharray=\"6,4\"/\u003e\n    \n    \u003c!-- Solapa de pestaña superior --\u003e\n    \u003cpath d=\"M -100 -115 L -60 -135 L 60 -135 L 100 -115 Z\" fill=\"#D4A762\"/\u003e\n    \u003ctext x=\"0\" y=\"-123\" font-family=\"'Courier New', monospace\" font-size=\"11\" font-weight=\"bold\" fill=\"#3A2510\" text-anchor=\"middle\"\u003eFONDO: JORGE ÁVILA - TRANSCRIPCIÓN BRUTA\u003c/text\u003e\n\n    \u003c!-- HOJA 1 (Izquierda): Transcripción densa sin editar --\u003e\n    \u003cg transform=\"translate(-185, -100) rotate(-2)\" filter=\"url(#softShadow)\"\u003e\n      \u003crect x=\"0\" y=\"0\" width=\"175\" height=\"240\" rx=\"3\" fill=\"url(#paperGrad)\"/\u003e\n      \u003c!-- Sello de \"ARCHIVO / ORALIDAD\" --\u003e\n      \u003cg transform=\"translate(110, 25) rotate(-8)\"\u003e\n        \u003crect x=\"0\" y=\"0\" width=\"55\" height=\"18\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"1.5\" rx=\"2\"/\u003e\n        \u003ctext x=\"27\" y=\"12\" font-family=\"'Courier New', monospace\" font-size=\"9\" font-weight=\"bold\" fill=\"#C0392B\" text-anchor=\"middle\"\u003eSIN EDITAR\u003c/text\u003e\n      \u003c/g\u003e\n      \u003c!-- Texto simulado de entrevista (marcas de oralidad) --\u003e\n      \u003ctext x=\"12\" y=\"25\" font-family=\"'Courier New', monospace\" font-size=\"9\" fill=\"#2C2C2C\" font-weight=\"bold\"\u003eENTREVISTA 01 (Audio_03)\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"45\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eINV: Eh... bueno, Jorge,\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"58\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eprimero que nada... este...\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"71\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003e¿cómo ves todo aquello?\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"90\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#222\" font-weight=\"bold\"\u003eÁVILA: M搾... mire, o sea,\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"103\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eyo siempre digo, ¿no?,\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"116\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eque la cosa viene... o sea,\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"129\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eviene por otro lado, digamos.\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"142\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003e[risas] [tos] Es complejo.\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"161\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eO sea, bah, no sé si\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"174\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003ese entiende lo que digo...\u003c/text\u003e\n      \u003c!-- Correcciones a mano (tachs y notas) --\u003e\n      \u003cline x1=\"12\" y1=\"42\" x2=\"60\" y2=\"47\" stroke=\"#C0392B\" stroke-width=\"1.2\"/\u003e\n      \u003cline x1=\"12\" y1=\"114\" x2=\"110\" y2=\"120\" stroke=\"#C0392B\" stroke-width=\"1.2\"/\u003e\n      \u003ccircle cx=\"130\" cy=\"116\" r=\"10\" fill=\"none\" stroke=\"#2980B9\" stroke-width=\"1.2\"/\u003e\n      \u003cpath d=\"M 140 110 Q 155 90 165 95\" fill=\"none\" stroke=\"#2980B9\" stroke-width=\"1\"/\u003e\n      \u003ctext x=\"145\" y=\"88\" font-family=\"'Caveat', cursive, sans-serif\" font-size=\"11\" fill=\"#2980B9\"\u003e¡Literal!\u003c/text\u003e\n    \u003c/g\u003e\n\n    \u003c!-- HOJA 2 (Derecha): Continuación de la transcripción --\u003e\n    \u003cg transform=\"translate(10, -105) rotate(1.5)\" filter=\"url(#softShadow)\"\u003e\n      \u003crect x=\"0\" y=\"0\" width=\"175\" height=\"240\" rx=\"3\" fill=\"url(#paperGrad)\"/\u003e\n      \u003ctext x=\"12\" y=\"25\" font-family=\"'Courier New', monospace\" font-size=\"9\" fill=\"#2C2C2C\" font-weight=\"bold\"\u003eTRANSCRIPCIÓN (Cont.)\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"45\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eINV: ¿Te referís al taller?\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"60\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#222\" font-weight=\"bold\"\u003eÁVILA: Claro, exacto, este...\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"73\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eeh... digamos que en el '78,\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"86\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eno me acuerdo bien, pará,\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"99\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003efue en el '79, ¿o no?, bueno,\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"112\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003ela cuestión es que sí, eh...\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"125\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003etodo era distinto, ¿viste?\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"144\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eEste... esteee... bueno.\u003c/text\u003e\n      \u003c!-- Marcas de repetición engorrosas --\u003e\n      \u003crect x=\"10\" y=\"134\" width=\"75\" height=\"15\" fill=\"#F1C40F\" opacity=\"0.3\"/\u003e\n      \u003ctext x=\"12\" y=\"163\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#888\"\u003e[Pausa larga - 4 seg.]\u003c/text\u003e\n      \u003ctext x=\"12\" y=\"182\" font-family=\"'Courier New', monospace\" font-size=\"8\" fill=\"#555\"\u003eY se armó la polémica nomás.\u003c/text\u003e\n      \u003c!-- Nota al margen manuscrita --\u003e\n      \u003cpath d=\"M 140 60 Q 155 70 160 85\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"1\"/\u003e\n      \u003ctext x=\"120\" y=\"95\" font-family=\"'Caveat', cursive, sans-serif\" font-size=\"10\" fill=\"#C0392B\"\u003e¿Exceso de muletillas?\u003c/text\u003e\n    \u003c/g\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Objetos de apoyo académico sobre el escritorio --\u003e\n  \u003c!-- Taza de café institucional / estudio --\u003e\n  \u003cg transform=\"translate(180, 260)\" filter=\"url(#dropShadow)\"\u003e\n    \u003cellipse cx=\"30\" cy=\"50\" rx=\"25\" ry=\"10\" fill=\"#1C1814\"/\u003e\n    \u003cpath d=\"M 5 20 L 10 50 C 10 60, 50 60, 50 50 L 55 20 Z\" fill=\"#ECE6DF\"/\u003e\n    \u003cellipse cx=\"30\" cy=\"20\" rx=\"25\" ry=\"8\" fill=\"#FAF7F2\"/\u003e\n    \u003cellipse cx=\"30\" cy=\"20\" rx=\"20\" ry=\"6\" fill=\"#5C3A21\"/\u003e\n    \u003c!-- Asa --\u003e\n    \u003cpath d=\"M 52 28 C 68 28, 68 45, 52 45\" fill=\"none\" stroke=\"#ECE6DF\" stroke-width=\"5\" stroke-linecap=\"round\"/\u003e\n    \u003c!-- Texto en taza --\u003e\n    \u003ctext x=\"30\" y=\"38\" font-family=\"sans-serif\" font-size=\"8\" fill=\"#666\" text-anchor=\"middle\"\u003eFBA • UNLP\u003c/text\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Lápiz y resaltador --\u003e\n  \u003cg transform=\"translate(230, 300) rotate(-15)\" filter=\"url(#dropShadow)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"110\" height=\"10\" fill=\"#F39C12\" rx=\"2\"/\u003e\n    \u003cpolygon points=\"110,0 120,5 110,10\" fill=\"#E67E22\"/\u003e\n    \u003cpolygon points=\"0,0 -10,5 0,10\" fill=\"#BDC3C7\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Tarjeta de Resultado / Feedback Académico (Izquierda) --\u003e\n  \u003cg transform=\"translate(30, 30)\" filter=\"url(#dropShadow)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"310\" height=\"260\" rx=\"8\" fill=\"url(#cardGrad)\" stroke=\"#D1C7BD\" stroke-width=\"1\"/\u003e\n    \n    \u003c!-- Barra superior institucional --\u003e\n    \u003cpath d=\"M 0 8 C 0 3, 3 0, 8 0 L 302 0 C 307 0, 310 3, 310 8 L 310 36 L 0 36 Z\" fill=\"#3B2E25\"/\u003e\n    \u003ctext x=\"15\" y=\"23\" font-family=\"sans-serif\" font-size=\"11\" font-weight=\"bold\" fill=\"#E2B777\"\u003eNODO F2 · EL ARCHIVISTA LITERAL\u003c/text\u003e\n\n    \u003c!-- Contenido del feedback --\u003e\n    \u003ctext x=\"20\" y=\"58\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#2C241D\"\u003eResultado: Conservación extrema\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"75\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#2C241D\"\u003ede la oralidad.\u003c/text\u003e\n\n    \u003ctext x=\"20\" y=\"105\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#4A4035\" width=\"270\"\u003e\n      \u003ctspan x=\"20\" dy=\"0\"\u003ePreservaste cada vacilación, cada giro\u003c/tspan\u003e\n      \u003ctspan x=\"20\" dy=\"16\"\u003edel diálogo real y el orden exacto en\u003c/tspan\u003e\n      \u003ctspan x=\"20\" dy=\"16\"\u003eque fluyó la conversación.\u003c/tspan\u003e\n    \u003c/text\u003e\n\n    \u003ctext x=\"20\" y=\"165\" font-family=\"sans-serif\" font-size=\"11\" fill=\"#8C3A2B\" font-weight=\"bold\" width=\"270\"\u003e\n      \u003ctspan x=\"20\" dy=\"0\"\u003e⚠️ Sin embargo, el texto todavía\u003c/tspan\u003e\n      \u003ctspan x=\"20\" dy=\"16\"\u003efunciona más como un documento\u003c/tspan\u003e\n      \u003ctspan x=\"20\" dy=\"16\"\u003ede archivo para investigadores que\u003c/tspan\u003e\n      \u003ctspan x=\"20\" dy=\"16\"\u003ecomo una entrevista lista para\u003c/tspan\u003e\n      \u003ctspan x=\"20\" dy=\"16\"\u003epublicar en un periódico.\u003c/tspan\u003e\n    \u003c/text\u003e\n\n    \u003c!-- Indicador de rol/contexto inferior --\u003e\n    \u003crect x=\"20\" y=\"230\" width=\"270\" height=\"20\" rx=\"4\" fill=\"#EFE8DD\"/\u003e\n    \u003ctext x=\"155\" y=\"244\" font-family=\"sans-serif\" font-size=\"9\" fill=\"#665A4D\" text-anchor=\"middle\"\u003eLengua y Producción de Textos · Bellas Artes\u003c/text\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Etiqueta de Caso (Flotante superior derecha) --\u003e\n  \u003cg transform=\"translate(520, 20)\" filter=\"url(#dropShadow)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"250\" height=\"50\" rx=\"6\" fill=\"#1E1712\" stroke=\"#4A3B32\" stroke-width=\"1.5\"/\u003e\n    \u003ccircle cx=\"20\" cy=\"25\" r=\"8\" fill=\"#E2B777\"/\u003e\n    \u003ctext x=\"35\" y=\"21\" font-family=\"sans-serif\" font-size=\"10\" font-weight=\"bold\" fill=\"#E2B777\"\u003eCASO DE ESTUDIO\u003c/text\u003e\n    \u003ctext x=\"35\" y=\"36\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#DCD6CD\"\u003eDe la oralidad al papel: Jorge Ávila\u003c/text\u003e\n  \u003c/g\u003e\n\u003c/svg\u003e",

      "title": "El Editor Intervencionista",
      "text": "Resultado: Sobre-edición o pérdida de identidad. El texto resultante tiene fluidez formal, pero en el camino cruzaste el límite de la curaduría editorial: al estandarizar el habla popular en lenguaje académico o introducir preguntas inductivas, el entrevistado dejó de sonar como un trabajador platense de 78 años.",
      "closingComment": "Balance para llevar a tu propia entrevista: Cuando la edición borra las marcas sociales, generacionales y políticas del entrevistado (un sesgo habitual cuando se delega la reescritura a una IA), el texto gana corrección formal pero pierde autenticidad humana.",
      "visualType": "svg",
      "visualContent": "\u003csvg viewBox=\"0 0 800 420\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\n  \u003cdefs\u003e\n    \u003c!-- Estilos tipográficos y globales --\u003e\n    \u003cstyle\u003e\n      @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&amp;family=Inter:wght@400;500;600;700&amp;display=swap');\n      .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px; fill: #2C3E50; }\n      .subtitle { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; fill: #E67E22; }\n      .body-text { font-family: 'Merriweather', serif; font-size: 13px; fill: #333333; }\n      .strikethrough-text { font-family: 'Merriweather', serif; font-size: 13px; fill: #C0392B; text-decoration: line-through; }\n      .corrected-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; fill: #27AE60; }\n      .ui-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 10px; fill: #7F8C8D; }\n    \u003c/style\u003e\n\n    \u003c!-- Filtros y Sombras --\u003e\n    \u003cfilter id=\"shadow\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"\u003e\n      \u003cfeDropShadow dx=\"2\" dy=\"4\" stdDeviation=\"4\" flood-color=\"#000000\" flood-opacity=\"0.12\"/\u003e\n    \u003c/filter\u003e\n    \u003cfilter id=\"soft-shadow\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"\u003e\n      \u003cfeDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"6\" flood-color=\"#000000\" flood-opacity=\"0.08\"/\u003e\n    \u003c/filter\u003e\n\n    \u003c!-- Patrón de fondo madera sutil --\u003e\n    \u003cpattern id=\"wood-desk\" width=\"100\" height=\"100\" patternUnits=\"userSpaceOnUse\"\u003e\n      \u003crect width=\"100\" height=\"100\" fill=\"#E8DCD2\"/\u003e\n      \u003cpath d=\"M0 20 Q50 25 100 20 M0 60 Q50 55 100 60\" stroke=\"#DFD1C3\" stroke-width=\"2\" fill=\"none\"/\u003e\n    \u003c/pattern\u003e\n  \u003c/defs\u003e\n\n  \u003c!-- Fondo General (Ambiente de estudio / Tal l=\"#FFFFFF\" font-size=\"13\"\u003eEl Editor Intervencionista\u003c/text\u003e\n    \n    \u003c!-- Contenido descriptivo --\u003e\n    \u003ctext x=\"16\" y=\"75\" class=\"ui-label\"\u003eCASO: JORGE ÁVILA (78 AÑOS)\u003c/text\u003e\n    \u003cforeignObject x=\"16\" y=\"85\" width=\"208\" height=\"240\"\u003e\n      \u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family: 'Inter', sans-serif; font-size: 11px; color: #555555; line-height: 1.4;\"\u003e\n        \u003cp style=\"margin-bottom: 8px; font-weight: 600; color: #C0392B;\"\u003eResultado: Sobre-edición o pérdida de identidad.\u003c/p\u003e\n        \u003cp style=\"margin-bottom: 8px;\"\u003eEl texto tiene fluidez formal, pero cruzaste el límite de la curaduría:\u003c/p\u003e\n        \u003cp style=\"background: #FADBD8; padding: 6px; border-left: 3px solid #E74C3C; font-size: 10px; color: #78281F;\"\u003e\n          Al estandarizar el habla popular en lenguaje académico, el entrevistado \u003cstrong\u003edejó de sonar como un trabajador platense\u003c/strong\u003e.\n        \u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/foreignObject\u003e\n  \u003c/g\u003e\n\n  \u003c!-- ZONA CENTRAL: MANUSCRITO / HOJA DE EDICIÓN (Objeto principal) --\u003e\n  \u003cg transform=\"translate(290, 30)\" filter=\"url(#shadow)\"\u003e\n    \u003c!-- Papel base --\u003e\n    \u003crect width=\"480\" height=\"365\" rx=\"4\" fill=\"#FFFCF7\" stroke=\"#E2D9CE\"/\u003e\n    \n    \u003c!-- Margen rojo de hoja carpeta / redacción --\u003e\n    \u003cline x1=\"40\" y1=\"0\" x2=\"40\" y2=\"365\" stroke=\"#F5B7B1\" stroke-width=\"1.5\"/\u003e\n\n    \u003c!-- Encabezado del documento de trabajo --\u003e\n    \u003ctext x=\"60\" y=\"35\" class=\"title\" font-size=\"14\"\u003eTranscripción intervenida: Entrevista a Jorge Ávila\u003c/text\u003e\n    \u003ctext x=\"60\" y=\"52\" class=\"subtitle\"\u003eDiagnóstico: Hipercorrección y pérdida de voz autoral\u003c/text\u003e\n    \u003cline x1=\"60\" y1=\"62\" x2=\"450\" y2=\"62\" stroke=\"#EAE3D2\" stroke-width=\"1\"/\u003e\n\n    \u003c!-- BLOQUE 1 DE TEXTO EDITADO (Tachaduras y correcciones exageradas) --\u003e\n    \u003cg transform=\"translate(60, 85)\"\u003e\n      \u003c!-- Línea original 1 --\u003e\n      \u003ctext x=\"0\" y=\"0\" class=\"body-text\"\u003e\"Yo siempre \u003c/text\u003e\n      \u003ctext x=\"78\" y=\"0\" class=\"strikethrough-text\"\u003elaburaba\u003c/text\u003e\n      \u003ctext x=\"145\" y=\"0\" class=\"corrected-text\"\u003edesempeñaba mis labores\u003c/text\u003e\n      \u003ctext x=\"315\" y=\"0\" class=\"body-text\"\u003e en los talleres\u003c/text\u003e\n      \n      \u003c!-- Anotación al margen (Marginalia del profe/editor) --\u003e\n      \u003cpath d=\"M 390 -5 Q 410 -5 415 10\" fill=\"none\" stroke=\"#E67E22\" stroke-width=\"1\" stroke-dasharray=\"2,2\"/\u003e\n      \u003crect x=\"375\" y=\"10\" width=\"75\" height=\"28\" rx=\"3\" fill=\"#FEF9E7\" stroke=\"F9E79F\"/\u003e\n      \u003ctext x=\"380\" y=\"22\" font-family=\"Inter\" font-size=\"9\" font-weight=\"700\" fill=\"#D68910\"\u003e¡Demasiado\u003c/text\u003e\n      \u003ctext x=\"380\" y=\"32\" font-family=\"Inter\" font-size=\"9\" font-weight=\"700\" fill=\"#D68910\"\u003eburocrático!\u003c/text\u003e\n\n      \u003c!-- Línea original 2 --\u003e\n      \u003ctext x=\"0\" y=\"35\" class=\"body-text\"\u003ede la vieja destilería, ¿viste? Y la verdad,\u003c/text\u003e\n      \n      \u003c!-- Línea original 3 --\u003e\n      \u003ctext x=\"0\" y=\"70\" class=\"text-container\"\u003enos armábamos unos \u003c/text\u003e\n      \u003ctext x=\"130\" y=\"70\" class=\"strikethrough-text\"\u003ebondiগুলির\u003c/text\u003e \u003c!-- texto tachado simulando jerga --\u003e\n      \u003crect x=\"125\" y=\"57\" width=\"65\" height=\"16\" fill=\"#FADBD8\" opacity=\"0.5\"/\u003e\n      \u003ctext x=\"127\" y=\"70\" class=\"strikethrough-text\"\u003ekilombos\u003c/text\u003e\n      \u003ctext x=\"185\" y=\"70\" class=\"corrected-text\"\u003econflictos sindicales complejos\u003c/text\u003e\n\n      \u003c!-- Línea original 4 --\u003e\n      \u003ctext x=\"0\" y=\"105\" class=\"body-text\"\u003ecuando nos querían cagar con el sueldo.\"\u003c/text\u003e\n      \u003cpath d=\"M 270 95 L 340 95\" stroke=\"#C0392B\" stroke-width=\"2\"/\u003e\n      \u003ctext x=\"270\" y=\"125\" class=\"corrected-text\"\u003e↳ \"¿Cómo evaluaría las discrepancias salariales?\"\u003c/text\u003e\n      \n      \u003c!-- Nota adhesiva tipo Post-it pegada sobre el papel --\u003e\n      \u003cg transform=\"translate(180, 135)\" filter=\"url(#soft-shadow)\"\u003e\n        \u003cpolygon points=\"0,0 95,0 95,65 0,65\" fill=\"#FEF5E7\"/\u003e\n        \u003c!-- Imitación de cinta adhesiva superior --\u003e\n        \u003crect x=\"30\" y=\"-5\" width=\"35\" height=\"10\" fill=\"#F4D03F\" opacity=\"0.6\"/\u003e\n        \u003ctext x=\"8\" y=\"18\" font-family=\"'Merriweather', serif\" font-style=\"italic\" font-size=\"10\" fill=\"#7E5109\"\u003e\"¿Pregunta\u003c/text\u003e\n        \u003ctext x=\"8\" y=\"32\" font-family=\"'Merriweather', serif\" font-style=\"italic\" font-size=\"10\" fill=\"#7E5109\"\u003einductiva!\"\u003c/text\u003e\n        \u003ctext x=\"8\" y=\"52\" font-family=\"Inter\" font-weight=\"600\" font-size=\"9\" fill=\"#B9770E\"\u003ePérdida de voz real\u003c/text\u003e\n      \u003c/g\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Indicador visual inferior en la hoja --\u003e\n    \u003crect x=\"60\" y=\"320\" width=\"360\" height=\"28\" rx=\"4\" fill=\"#F2F4F4\" stroke=\"#D5DBDB\"/\u003e\n    \u003ccircle cx=\"75\" cy=\"334\" r=\"5\" fill=\"#E74C3C\"/\u003e\n    \u003ctext x=\"90\" y=\"338\" font-family=\"Inter\" font-weight=\"600\" font-size=\"10\" fill=\"#5D6D7E\"\u003e\n      Efecto: El lector ya no escucha a Jorge (78), lee a un académi\u003ctspan fill=\"#E74C3C\"\u003eco.\u003c/tspan\u003e\n    \u003c/text\u003e\n  \u003c/g\u003e\n\n  \u003c!-- ELEMENTOS DECORATIVOS DE ESCRITORIO (Contexto disciplina / UNLP) --\u003e\n  \u003c!-- Lápi fill=\"#FADBD8\" stroke=\"#E74C3C\" stroke-dasharray=\"4 2\" rx=\"3\"/\u003e\n      \u003ctext x=\"10\" y=\"18\" fill=\"#C0392B\" font-family=\"Segoe UI, sans-serif\" font-size=\"10\" font-weight=\"bold\"\u003e[ ZONA PODADA: Cierre emotivo / Juventud ]\u003c/text\u003e\n      \u003ctext x=\"10\" y=\"33\" fill=\"#7F8C8D\" font-family=\"Segoe UI, sans-serif\" font-size=\"9\"\u003eSe omitió el testimonio emotivo central de la época.\u003c/text\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Párrafo final (Muy escueto) --\u003e\n    \u003cg transform=\"translate(45, 215)\"\u003e\n      \u003cline x1=\"0\" y1=\"0\" x2=\"140\" y2=\"0\" stroke=\"#34495E\" stroke-width=\"2\"/\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Sello de \"Edición Fragmentada\" --\u003e\n    \u003cg transform=\"translate(195, 185) rotate(-12)\" opacity=\"0.85\"\u003e\n      \u003crect x=\"0\" y=\"0\" width=\"110\" height=\"30\" rx=\"3\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2\"/\u003e\n      \u003ctext x=\"8\" y=\"20\" fill=\"#C0392B\" font-family=\"Segoe UI, sans-serif\" font-size=\"10\" font-weight=\"bold\"\u003eRECORTES POCO CLAROS\u003c/text\u003e\n    \u003c/g\u003e\n  \u003c/g\u003e\n\n  \u003c!-- LÁPIZ Y HERRAMIENTAS DE EDICIÓN --\u003e\n  \u003cg transform=\"translate(320, 240) rotate(-25)\"\u003e\n    \u003cpolygon points=\"0,15 120,0 120,12 0,15\" fill=\"#E67E22\"/\u003e\n    \u003cpolygon points=\"120,0 135,6 120,12\" fill=\"#D35400\"/\u003e\n    \u003cpolygon points=\"135,6 140,6 135,9\" fill=\"#2C3E50\"/\u003e \u003c!-- Punta --\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"15\" height=\"15\" fill=\"#BDC3C7\"/\u003e\n    \u003crect x=\"15\" y=\"2\" width=\"10\" height=\"11\" fill=\"#E74C3C\"/\u003e \u003c!-- Gorracha --\u003e\n  \u003c/g\u003e\n\n  \u003c!-- PANEL DE DIAGNÓSTICO (Feedback del Nodo F4) --\u003e\n  \u003cg transform=\"translate(415, 75)\" filter=\"url(#dropShadow)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"355\" height=\"235\" rx=\"6\" fill=\"url(#paperGrad)\" str let state = {
  registered: !DATOS_SIMULADOR.requireLogin,
  studentName: '',
  studentId: '',
  submitted: false,
  currentNodeId: DATOS_SIMULADOR.nodes[0].id,
  vars: {},
  history: [],
  pendingConsequence: null
};

function initVars() {
  const v = {};
  DATOS_SIMULADOR.variables.forEach(item => {
    if (item.type === 'number') {
      v[item.name] = Number(item.initial);
    } else {
      const s = String(item.initial ?? 'no').toLowerCase().trim();
      v[item.name] = (s === 'si' || s === 'sí' || s === 'true') ? 'si' : s;
    }
  });
  return v;
}

function findVarName(raw) {
  const clean = String(raw || '').trim().toLowerCase();
  const found = DATOS_SIMULADOR.variables.find(v => v.name.toLowerCase() === clean);
  return found ? found.name : null;
}

function applyEffects(vars, effectsStr) {
  const next = Object.assign({}, vars);
  if (!effectsStr || effectsStr.trim() === '—' || effectsStr.trim() === '-') return next;
  effectsStr.split(/[;,]/).map(s => s.trim()).filter(Boolean).forEach(part => {
    const assign = part.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*=\s*(.+)$/);
    if (assign) {
      const vn = findVarName(assign[1]);
      const val = assign[2].trim().toLowerCase();
      if (vn) next[vn] = (val === 'si' || val === 'sí' || val === 'true') ? 'si' : val;
      return;
    }
    const delta = part.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*([+\-−])\s*(\d+(\.\d+)?)$/);
    if (delta) {
      const vn = findVarName(delta[1]);
      const sign = delta[2] === '+' ? 1 : -1;
      const num = parseFloat(delta[3]);
      if (vn && typeof next[vn] === 'number') {
        next[vn] = Math.max(0, Math.min(10, next[vn] + sign * num));
      }
    }
  });
  return next;
}

function evalCondition(vars, expr) {
  if (!expr || !expr.trim()) return true;
  const clean = expr.trim().replace(/^(la opción aparece solo si|la opcion aparece solo si|aparece solo si|solo si)\s+/i, '').trim();
  const m = clean.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*(>=|<=|≥|≤|=|>|<|mayor o igual que|menor o igual que|menor que|mayor que)\s*(.+)$/i);
  if (!m) return true;
  const vn = findVarName(m[1]);
  if (!vn) return true;
  const op = m[2].toLowerCase();
  const rhs = m[3].trim().toLowerCase().replace(/\.$/, '');
  const cur = vars[vn];
  if (typeof cur === 'number') {
    const n = parseFloat(rhs);
    if (op === '>=' || op === '≥' || op === 'mayor o igual que') return cur >= n;
    if (op === '<=' || op === '≤' || op === 'menor o igual que') return cur <= n;
    if (op === '>' || op === 'mayor que') return cur > n;
    if (op === '<' || op === 'menor que') return cur < n;
    if (op === '=') return cur === n;
  } else {
    const cNorm = (cur === 'si' || cur === 'sí') ? 'si' : String(cur).toLowerCase();
    const rNorm = (rhs === 'si' || rhs === 'sí') ? 'si' : rhs;
    if (op === '=') return cNorm === rNorm;
  }
  return true;
}

function resolveDest(opt, varsAfter) {
  if (opt.targetCondition) {
    const bm = opt.targetCondition.match(/va a\s+([A-Za-z0-9_]+)\s+si\s+([^;]+);\s*si\s*no,?\s*(?:va a\s*)?([A-Za-z0-9_]+)/i);
    if (bm) return evalCondition(varsAfter, bm[2]) ? bm[1].trim() : bm[3].trim();
  }
  return String(opt.to || '').split(/\s+o\s+/)[0].trim();
}

function escapeHtml(s) {
  return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function beginWithStudent() {
  const n = document.getElementById('st-name').value.trim();
  const id = document.getElementById('st-id').value.trim();
  const err = document.getElementById('st-err');
  if (!n) {
    err.style.display = 'block';
    err.textContent = 'Por favor ingresá tu Nombre y Apellido para iniciar.';
    return;
  }
  state.studentName = n;
  state.studentId = id;
  state.registered = true;
  render();
}

async function sendResultToSheet() {
  const btn = document.getElementById('btn-sheet-submit');
  if (!btn || state.submitted) return;
  btn.disabled = true;
  btn.textContent = 'Enviando registro a la cátedra...';

  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  const routeCode = state.history.map(h => h.optionId).concat([node ? node.id : '']).join(', ');
  const varsSummary = DATOS_SIMULADOR.variables.map(v => v.name + ': ' + state.vars[v.name]).join(' | ');
  const stepsSummary = state.history.map((h, i) => (i+1) + '. ' + h.optionId + ' (' + h.optionText + ')').join(' -> ');

  const payload = {
    studentName: state.studentName || 'Sin nombre',
    studentId: state.studentId || '-',
    simTitle: DATOS_SIMULADOR.meta.title,
    finalNode: node ? (node.id + ' - ' + node.title) : '',
    routeCode: routeCode,
    finalVars: varsSummary,
    stepsDetail: stepsSummary
  };

  if (DATOS_SIMULADOR.sheetsWebhookUrl) {
    try {
      await fetch(DATOS_SIMULADOR.sheetsWebhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      state.submitted = true;
      btn.textContent = '✓ Recorrido registrado correctamente en la planilla docente';
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Reintentar envío a la planilla';
    }
  } else {
    state.submitted = true;
    btn.textContent = '✓ Finalización confirmada (Copiá tu código abajo)';
  }
}

function render() {
  document.getElementById('sim-title').textContent = DATOS_SIMULADOR.meta.title;
  document.getElementById('sim-role').textContent = 'Rol: ' + DATOS_SIMULADOR.meta.role + (state.studentName ? ' · Alumno/a: ' + state.studentName : '');
  const screen = document.getElementById('sim-screen');

  if (!state.registered) {
    screen.innerHTML = '<div class="content">' +
      '<span class="badge badge-decision">Registro de Estudiante</span>' +
      '<h2>' + escapeHtml(DATOS_SIMULADOR.meta.title) + '</h2>' +
      '<p style="color:var(--muted);margin-bottom:10px;">Ingresá tus datos antes de comenzar. Al finalizar el caso, tu recorrido quedará registrado para el docente.</p>' +
      '<div id="st-err" class="msg-banner"></div>' +
      '<div class="login-box">' +
      '<label class="field-label">Nombre y Apellido *</label>' +
      '<input type="text" id="st-name" class="field-input" placeholder="Ej: Juan Pérez" value="' + escapeHtml(state.studentName) + '">' +
      '<label class="field-label">Legajo / DNI (Opcional)</label>' +
      '<input type="text" id="st-id" class="field-input" style="margin-bottom:0;" placeholder="Ej: 40123456" value="' + escapeHtml(state.studentId) + '">' +
      '</div>' +
      '<button class="option-btn" onclick="beginWithStudent()"><span>Comenzar simulación →</span></button>' +
      '</div>';
    return;
  }

  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  if (!node) return;

  let visual = '';
  if (node.visualType === 'svg' && node.visualContent) {
    visual = '<div class="visual-box">' + node.visualContent + '</div>';
  } else if (node.visualType === 'image' && node.visualContent) {
    visual = '<div class="visual-box"><img src="' + node.visualContent + '" alt=""></div>';
  }

  if (state.pendingConsequence) {
    screen.innerHTML = visual + '<div class="content">' +
      '<span class="badge badge-decision">Consecuencia inmediata</span>' +
      '<p class="situation-text">' + escapeHtml(state.pendingConsequence.text) + '</p>' +
      '<button class="option-btn" onclick="continueStep()"><span>Continuar →</span></button>' +
      '</div>';
    return;
  }

  if (node.type === 'final') {
    const code = state.history.map(h => h.optionId).concat([node.id]).join(', ');
    const varsHtml = DATOS_SIMULADOR.variables.map(v => {
      const val = state.vars[v.name];
      if (v.type === 'number') {
        const pct = Math.round((Number(val)/10)*100);
        return '<div class="var-card"><div><strong>' + escapeHtml(v.name) + ':</strong> ' + val + ' / 10</div>' +
               '<div class="bar-bg"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>';
      }
      return '<div class="var-card"><strong>' + escapeHtml(v.name) + ':</strong> ' + escapeHtml(val) + '</div>';
    }).join('');

    const histHtml = state.history.map((h, i) =>
      '<div class="step-item"><strong>Paso ' + (i+1) + ' (' + escapeHtml(h.optionId) + '):</strong> ' +
      escapeHtml(h.nodeText) + '<br><em>Elegiste: ' + escapeHtml(h.optionText) + '</em></div>'
    ).join('');

    const submitBox = '<div class="submit-sheet-box">' +
      '<div style="font-size:13px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.9;">Confirmación de finalización</div>' +
      '<div style="font-size:20px;font-weight:800;margin:4px 0;">Registrar mi recorrido para el docente</div>' +
      '<div style="font-size:15px;opacity:0.95;">Estudiante: <strong>' + escapeHtml(state.studentName || 'Registrado') + '</strong> · Código: <strong>' + escapeHtml(code) + '</strong></div>' +
      '<button id="btn-sheet-submit" class="submit-sheet-btn" onclick="sendResultToSheet()" ' + (state.submitted ? 'disabled' : '') + '>' +
      (state.submitted ? '✓ Recorrido registrado correctamente en la planilla docente' : '✓ Finalizar y Enviar mi Recorrido al Docente') +
      '</button></div>';

    screen.innerHTML = visual + '<div class="content">' +
      '<span class="badge badge-final">Final · ' + escapeHtml(node.id) + '</span>' +
      '<h2>' + escapeHtml(node.title) + '</h2>' +
      '<p class="situation-text">' + escapeHtml(node.text) + '</p>' +
      '<div class="closing-box"><strong>Comentario de cierre:</strong><br>' + escapeHtml(node.closingComment) + '</div>' +
      submitBox +
      '<h3>Valores finales de las variables</h3><div class="vars-grid">' + varsHtml + '</div>' +
      '<h3>Recorrido completo</h3>' + histHtml +
      '<div class="code-box"><div><small style="color:#A8A09A;display:block;">CÓDIGO DE RECORRIDO</small><strong id="route-code">' + escapeHtml(code) + '</strong></div>' +
      '<button class="secondary-btn" onclick="copyCode()">Copiar código</button></div>' +
      '<button class="option-btn" onclick="restartSim()"><span>Volver a empezar</span></button>' +
      '</div>';
    return;
  }

  const opts = DATOS_SIMULADOR.options.filter(o => o.from === node.id && (!o.appearCondition || evalCondition(state.vars, o.appearCondition)));
  const optsHtml = opts.map(o =>
    '<button class="option-btn" onclick="chooseOption(\'' + o.id + '\')">' +
    '<span class="opt-letter">' + escapeHtml(o.label) + '</span>' +
    '<span>' + escapeHtml(o.text) + '</span></button>'
  ).join('');

  screen.innerHTML = visual + '<div class="content">' +
    '<span class="badge badge-decision">Situación · ' + escapeHtml(node.id) + '</span>' +
    '<p class="situation-text">' + escapeHtml(node.text) + '</p>' +
    '<div class="options-list">' + optsHtml + '</div></div>';
}

function chooseOption(optId) {
  const opt = DATOS_SIMULADOR.options.find(o => o.id === optId);
  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  if (!opt || !node) return;
  state.vars = applyEffects(state.vars, opt.effects);
  const nextId = resolveDest(opt, state.vars);
  state.history.push({ nodeId: node.id, nodeText: node.text, optionId: opt.id, optionText: opt.text });
  if (opt.immediateConsequence && opt.immediateConsequence.trim() !== '—') {
    state.pendingConsequence = { text: opt.immediateConsequence, nextNodeId: nextId };
  } else {
    state.currentNodeId = nextId;
  }
  render();
}

function continueStep() {
  if (state.pendingConsequence) {
    state.currentNodeId = state.pendingConsequence.nextNodeId;
    state.pendingConsequence = null;
    render();
  }
}

function copyCode() {
  const code = document.getElementById('route-code').textContent;
  const t = document.createElement('textarea');
  t.value = code;
  document.body.appendChild(t);
  t.select();
  document.execCommand('copy');
  document.body.removeChild(t);
}

function restartSim() {
  state = {
    registered: state.studentName ? true : (!DATOS_SIMULADOR.requireLogin),
    studentName: state.studentName,
    studentId: state.studentId,
    submitted: false,
    currentNodeId: DATOS_SIMULADOR.nodes[0].id,
    vars: initVars(),
    history: [],
    pendingConsequence: null
  };
  render();
}

state.vars = initVars();
render();
</script>
